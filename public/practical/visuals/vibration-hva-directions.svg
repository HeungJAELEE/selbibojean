<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">회전기계 진동 H V A 측정방향</title>
  <desc id="desc">축과 베어링 하우징을 기준으로 수평 H 수직 V 축방향 A를 표시한 학습용 도식</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0369a1"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker>
  </defs>
  <rect width="960" height="540" rx="32" fill="#f8fafc"/>
  <text x="56" y="66" fill="#173957" font-size="30" font-weight="800" font-family="system-ui, sans-serif">진동 측정방향 H · V · A</text>
  <g transform="translate(150 164)">
    <rect x="40" y="88" width="530" height="140" rx="28" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
    <circle cx="116" cy="158" r="80" fill="#e2e8f0" stroke="#475569" stroke-width="8"/>
    <circle cx="116" cy="158" r="28" fill="#64748b"/>
    <rect x="116" y="136" width="520" height="44" rx="22" fill="#94a3b8"/>
    <rect x="500" y="48" width="92" height="220" rx="18" fill="#cbd5e1" stroke="#475569" stroke-width="5"/>
    <text x="305" y="208" text-anchor="middle" fill="#173957" font-size="20" font-weight="800" font-family="system-ui, sans-serif">회전축</text>
    <text x="546" y="298" text-anchor="middle" fill="#475569" font-size="16" font-family="system-ui, sans-serif">베어링 하우징</text>
    <path d="M546 22V-70" stroke="#0f766e" stroke-width="8" marker-end="url(#arrow-teal)"/>
    <text x="572" y="-42" fill="#0f766e" font-size="25" font-weight="800" font-family="system-ui, sans-serif">V 수직</text>
    <path d="M474 158H350" stroke="#0369a1" stroke-width="8" marker-end="url(#arrow-blue)"/>
    <text x="330" y="150" text-anchor="end" fill="#0369a1" font-size="25" font-weight="800" font-family="system-ui, sans-serif">H 수평</text>
    <path d="M636 158H760" stroke="#c2410c" stroke-width="8" marker-end="url(#arrow-orange)"/>
    <text x="786" y="150" fill="#c2410c" font-size="25" font-weight="800" font-family="system-ui, sans-serif">A 축방향</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="17">
    <text x="56" y="464" fill="#0369a1" font-weight="800">H</text><text x="82" y="464" fill="#475569">바닥과 평행한 반경방향</text>
    <text x="354" y="464" fill="#0f766e" font-weight="800">V</text><text x="380" y="464" fill="#475569">바닥과 수직인 반경방향</text>
    <text x="668" y="464" fill="#c2410c" font-weight="800">A</text><text x="694" y="464" fill="#475569">회전축과 나란한 방향</text>
  </g>
</svg>
