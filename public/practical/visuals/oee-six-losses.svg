<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">OEE 세 요소와 설비 6대 로스</title>
  <desc id="desc">시간가동률 성능가동률 양품률과 각각 연결되는 설비 6대 로스를 정리한 학습용 도식</desc>
  <rect width="960" height="540" rx="32" fill="#f8fafc"/>
  <text x="54" y="64" fill="#173957" font-size="30" font-weight="800" font-family="system-ui, sans-serif">OEE = 시간가동률 × 성능가동률 × 양품률</text>
  <g font-family="system-ui, sans-serif">
    <g transform="translate(54 112)">
      <rect width="260" height="320" rx="24" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
      <text x="130" y="48" text-anchor="middle" fill="#075985" font-size="24" font-weight="800">시간가동률</text>
      <text x="130" y="78" text-anchor="middle" fill="#475569" font-size="15">멈춘 시간을 찾는다</text>
      <rect x="25" y="112" width="210" height="72" rx="16" fill="#fff"/><text x="130" y="143" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="800">고장 로스</text><text x="130" y="168" text-anchor="middle" fill="#64748b" font-size="14">설비 정지</text>
      <rect x="25" y="204" width="210" height="72" rx="16" fill="#fff"/><text x="130" y="235" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="800">준비·조정 로스</text><text x="130" y="260" text-anchor="middle" fill="#64748b" font-size="14">교체·조건 맞춤</text>
    </g>
    <g transform="translate(350 112)">
      <rect width="260" height="320" rx="24" fill="#ccfbf1" stroke="#5eead4" stroke-width="2"/>
      <text x="130" y="48" text-anchor="middle" fill="#115e59" font-size="24" font-weight="800">성능가동률</text>
      <text x="130" y="78" text-anchor="middle" fill="#475569" font-size="15">느려진 이유를 찾는다</text>
      <rect x="25" y="112" width="210" height="72" rx="16" fill="#fff"/><text x="130" y="143" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="800">공회전·순간정지</text><text x="130" y="168" text-anchor="middle" fill="#64748b" font-size="14">짧은 멈춤 반복</text>
      <rect x="25" y="204" width="210" height="72" rx="16" fill="#fff"/><text x="130" y="235" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="800">속도저하 로스</text><text x="130" y="260" text-anchor="middle" fill="#64748b" font-size="14">기준 속도 미달</text>
    </g>
    <g transform="translate(646 112)">
      <rect width="260" height="320" rx="24" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
      <text x="130" y="48" text-anchor="middle" fill="#92400e" font-size="24" font-weight="800">양품률</text>
      <text x="130" y="78" text-anchor="middle" fill="#475569" font-size="15">불량품을 찾는다</text>
      <rect x="25" y="112" width="210" height="72" rx="16" fill="#fff"/><text x="130" y="143" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="800">공정불량 로스</text><text x="130" y="168" text-anchor="middle" fill="#64748b" font-size="14">생산 중 불량</text>
      <rect x="25" y="204" width="210" height="72" rx="16" fill="#fff"/><text x="130" y="235" text-anchor="middle" fill="#0f172a" font-size="19" font-weight="800">초기수율 로스</text><text x="130" y="260" text-anchor="middle" fill="#64748b" font-size="14">가동 초기 불량</text>
    </g>
  </g>
  <path d="M314 272H350M610 272H646" stroke="#173957" stroke-width="6" stroke-linecap="round"/>
  <text x="54" y="490" fill="#64748b" font-size="16" font-family="system-ui, sans-serif">판단 순서: 정지 → 속도 → 품질 중 어디에서 손실이 났는지 먼저 구분한다.</text>
</svg>
