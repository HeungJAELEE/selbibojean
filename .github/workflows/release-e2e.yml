name: Release E2E

on:
  pull_request:
  push:
    branches:
      - main
      - codex/cbt-batch14-release-integration-20260808

permissions:
  contents: read

concurrency:
  group: release-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.9.2
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Install the Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Build the production-like Worker artifact
        run: npm run build
      - name: Verify build answer isolation
        run: npm run verify:no-answer-leak -- --scope=build
      - name: Run desktop and mobile release gates
        run: npm run test:e2e:release
