name: Database gate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/cbt-batch14-release-integration-20260808

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.112.0
          github-token: ${{ github.token }}
      - name: Start the pinned local Supabase stack
        run: supabase start
      - name: Rebuild the database from migrations
        run: supabase db reset
      - name: Lint Postgres functions and schema
        run: supabase db lint --level error
      - name: Run structural and behavioral RLS tests
        run: supabase test db
      - name: Stop the local Supabase stack
        if: always()
        run: supabase stop --no-backup
