name: Batch14 source snapshot

on:
  push:
    branches:
      - codex/cbt-batch14-release-integration-20260808
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/source-commit.txt
          git status --short > /tmp/source-status.txt
          test ! -s /tmp/source-status.txt

      - name: Package source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/selbibojean-batch14-source.tar.gz .
          sha256sum /tmp/selbibojean-batch14-source.tar.gz > /tmp/source-archive.sha256

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: selbibojean-batch14-source
          path: |
            /tmp/selbibojean-batch14-source.tar.gz
            /tmp/source-commit.txt
            /tmp/source-archive.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
