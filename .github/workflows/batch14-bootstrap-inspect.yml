name: Batch14 bootstrap inspect

on:
  push:
    branches:
      - codex/cbt-batch14-bootstrap-20260808
    paths:
      - '.batch14-bootstrap/**'
      - '.github/workflows/batch14-bootstrap-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and inspect Batch14 payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/batch14-inspect
          cat .batch14-bootstrap/chunk-*.b64 > /tmp/batch14-inspect/payload.b64
          base64 --decode /tmp/batch14-inspect/payload.b64 > /tmp/batch14-inspect/payload.xz
          xz --test /tmp/batch14-inspect/payload.xz
          xz --decompress --stdout /tmp/batch14-inspect/payload.xz > /tmp/batch14-inspect/payload.decoded

          {
            echo "chunk_count=$(find .batch14-bootstrap -maxdepth 1 -type f -name 'chunk-*.b64' | wc -l)"
            echo "base64_bytes=$(wc -c < /tmp/batch14-inspect/payload.b64)"
            echo "compressed_bytes=$(wc -c < /tmp/batch14-inspect/payload.xz)"
            echo "decoded_bytes=$(wc -c < /tmp/batch14-inspect/payload.decoded)"
            echo "compressed_sha256=$(sha256sum /tmp/batch14-inspect/payload.xz | awk '{print $1}')"
            echo "decoded_sha256=$(sha256sum /tmp/batch14-inspect/payload.decoded | awk '{print $1}')"
            echo "compressed_type=$(file -b /tmp/batch14-inspect/payload.xz)"
            echo "decoded_type=$(file -b /tmp/batch14-inspect/payload.decoded)"
          } | tee /tmp/batch14-inspect/inspection.txt

          echo '--- decoded prefix ---' | tee -a /tmp/batch14-inspect/inspection.txt
          head -c 4096 /tmp/batch14-inspect/payload.decoded | strings | head -80 | tee -a /tmp/batch14-inspect/inspection.txt || true

          if tar -tf /tmp/batch14-inspect/payload.decoded >/tmp/batch14-inspect/tar-list.txt 2>/dev/null; then
            echo 'decoded_format=tar' | tee -a /tmp/batch14-inspect/inspection.txt
            head -100 /tmp/batch14-inspect/tar-list.txt | tee -a /tmp/batch14-inspect/inspection.txt
          else
            echo 'decoded_format=non_tar' | tee -a /tmp/batch14-inspect/inspection.txt
          fi

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch14-bootstrap-inspection
          path: /tmp/batch14-inspect/
          if-no-files-found: error
          retention-days: 3
